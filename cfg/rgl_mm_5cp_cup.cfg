// 5cp config for RGL No Restriction 6s Cup
// Config originally created October 1, 2026
// EXEC THIS MANUALLY, DO NOT EXEC THE BASE.CFG

exec "rgl_mm_base"

servercfgfile "rgl_mm_5cp_cup" // sets server cfg to this config so that it gets autoexeced on level change

sm plugins load enhanced_match_timer    // loads the enhanced match timer

mp_timelimit "20"                       // sets server timelimit to 20 minutes
mp_timelimit_improved_timelimit "40"    // sets overtime timelimit to 40 minutes
mp_winlimit "4"                         // sets number of wins to win the game to 4
mp_windifference "0"                    // unsets windifference
mp_maxrounds "0"                        // unsets maxrounds

mp_timelimit_improved "1"		       // enables the Improved Match Timer plugin
mp_roundtime "600"                     // sets round timer to 10 minutes
mp_timelimit_improved_threshold "-1"   
mp_timelimit_improved_timelimit "5"
mp_timelimit_improved_tiebreaker "1"

mp_tournament_restart                   // restarts the tournament to apply above settings


say "RGL No Restriction 6s 5cp Cup Config Executed."
say "First to 4 wins! There is no timelimit."
say "To be safe, please ***CHANGELEVEL*** to reload all settings properly and prevent any crashes."
say "To end the game early for whatever reason, simply reexec this config."
say "Exec rgl_off or restart your server 90 seconds after you have fully finished playing."